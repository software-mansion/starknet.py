# Marks idle pull requests as stale and closes them after a grace period.
# Issues are out of scope: days-before-issue-* is -1.
# To update .github/workflows/actions.lock after changing any `uses:`,
# run `gh actions-lock` locally.

name: Stale PRs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request has had no activity for 60 days. It will be
            closed in 14 days unless there is new activity or the `pinned`
            label is added.
          close-pr-message: This pull request was closed after 14 days of inactivity.
          exempt-pr-labels: pinned
          exempt-draft-pr: true
          operations-per-run: 100
